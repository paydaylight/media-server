services:
  # =============== IMMICH ==============
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - UPLOAD_LOCATION=${IMMICH_UPLOAD_LOCATION}
      - DB_DATA_LOCATION=${IMMICH_DB_DATA_LOCATION}
      - IMMICH_VERSION=${IMMICH_VERSION}
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    environment:
      - TZ=${TZ}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - UPLOAD_LOCATION=${IMMICH_UPLOAD_LOCATION}
      - DB_DATA_LOCATION=${IMMICH_DB_DATA_LOCATION}
      - IMMICH_VERSION=${IMMICH_VERSION}
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
  # =============== IMMICH ==============

  # ============== JELLYFIN =============
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${UID}:${GID}"
    network_mode: host
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ${JELLYFIN_MEDIA_LOCATION}:/media:ro
    environment:
      - TZ=${TZ}
    restart: unless-stopped
  # ============== JELLYFIN =============

  # =============== SAMBA ===============
  samba-config:
    image: alpine
    container_name: samba-config
    environment:
      - SAMBA_NAME=${SAMBA_NAME}
      - SAMBA_SHARE_PATH=${SAMBA_SHARE_PATH}
      - USER_NAME=${USER_NAME}
    volumes:
      - ./samba:/work
    command: >
      sh -c "apk add --no-cache gettext &&
             envsubst '$$SAMBA_NAME $$SAMBA_SHARE_PATH $$USER_NAME'
               < /work/smb.conf.template > /work/smb.conf"
  
  samba:
    image: dockurr/samba
    container_name: samba
    depends_on:
      samba-config:
        condition: service_completed_successfully
    environment:
      - NAME=${SAMBA_NAME}
      - USER=${SAMBA_USER}
      - PASS=${SAMBA_PASS}
    ports:
      - 445:445
    volumes:
      - ./data:/shared
      - ./samba/smb.conf:/etc/samba/smb.conf
    restart: always
  # =============== SAMBA ===============

