services:
  # =============== IMMICH ==============
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - UPLOAD_LOCATION=${IMMICH_UPLOAD_LOCATION}
      - DB_DATA_LOCATION=${IMMICH_DB_DATA_LOCATION}
      - IMMICH_VERSION=${IMMICH_VERSION}
    ports:
      - '2283:2283'
    devices:
      # Intel iGPU (Quick Sync) for hardware video transcoding
      - /dev/dri:/dev/dri
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    environment:
      - TZ=${TZ}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - UPLOAD_LOCATION=${IMMICH_UPLOAD_LOCATION}
      - DB_DATA_LOCATION=${IMMICH_DB_DATA_LOCATION}
      - IMMICH_VERSION=${IMMICH_VERSION}
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
  # =============== IMMICH ==============

  # ============== JELLYFIN =============
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${UID}:${GID}"
    network_mode: host
    devices:
      # Intel iGPU (Quick Sync) for hardware transcoding
      - /dev/dri:/dev/dri
    group_add:
      # GID of the server's "render" group, so Jellyfin may use the iGPU
      - "${RENDER_GID}"
    volumes:
      - ${APPDATA_LOCATION}/jellyfin/config:/config
      - ${APPDATA_LOCATION}/jellyfin/cache:/cache
      - ${JELLYFIN_MEDIA_LOCATION}:/media:ro
    environment:
      - TZ=${TZ}
    restart: unless-stopped
  # ============== JELLYFIN =============

  # =============== SAMBA ===============
  samba:
    image: dockurr/samba
    container_name: samba
    environment:
      - NAME=${SAMBA_MEDIA_NAME}
      - USER=${SAMBA_USER}
      - PASS=${SAMBA_PASS}
      - UID=${UID}
      - GID=${GID}
    ports:
      - 445:445
    volumes:
      - ${SAMBA_MEDIA_PATH}:/${SAMBA_MEDIA_NAME}
      - ${SAMBA_STORAGE_PATH}:/${SAMBA_STORAGE_NAME}:ro
    configs:
      - source: smb_conf
        target: /etc/samba/smb.conf
    restart: always
  # =============== SAMBA ===============

  # ============== PIHOLE ===============
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI: served through Caddy at http://pihole.${LAN_DOMAIN}
      # Direct fallback if Caddy is down: http://${SERVER_IP}:8081/admin
      - "8081:80/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      - TZ=${TZ}
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      - FTLCONF_dns_listeningMode=all
      # Local DNS records for the reverse proxy (managed here, read-only in the web UI)
      - FTLCONF_dns_hosts=${SERVER_IP} homeserver.${LAN_DOMAIN};${SERVER_IP} pihole.${LAN_DOMAIN};${SERVER_IP} jellyfin.${LAN_DOMAIN};${SERVER_IP} immich.${LAN_DOMAIN};${SERVER_IP} games.${LAN_DOMAIN};${SERVER_IP} qbittorrent.${LAN_DOMAIN};${SERVER_IP} prowlarr.${LAN_DOMAIN};${SERVER_IP} radarr.${LAN_DOMAIN};${SERVER_IP} sonarr.${LAN_DOMAIN};${SERVER_IP} requests.${LAN_DOMAIN};${SERVER_IP} scrutiny.${LAN_DOMAIN};${SERVER_IP} status.${LAN_DOMAIN};${SERVER_IP} resources.${LAN_DOMAIN};${SERVER_IP} home.${LAN_DOMAIN}
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - ${APPDATA_LOCATION}/pihole:/etc/pihole
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://docs.pi-hole.net/docker/configuration/#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped
  # ============== PIHOLE ===============

  # ============ PUFFERPANEL ============
  pufferpanel:
    image: pufferpanel/pufferpanel:latest
    container_name: pufferpanel
    network_mode: host
    volumes:
      - ${APPDATA_LOCATION}/pufferpanel/config:/etc/pufferpanel
      - /var/lib/pufferpanel:/var/lib/pufferpanel
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
  # ============ PUFFERPANEL ============

  # ============== DOWNLOADS ==============
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - WEBUI_PORT=8085
      - TORRENTING_PORT=6881
    volumes:
      - ${APPDATA_LOCATION}/qbittorrent:/config
      - ${MEDIA_LOCATION}/downloads:/media/downloads
    ports:
      - 8085:8085
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_LOCATION}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_LOCATION}/radarr:/config
      - ${MEDIA_LOCATION}:/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_LOCATION}/sonarr:/config
      - ${MEDIA_LOCATION}:/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8989:8989
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_LOCATION}/seerr:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 5055:5055
    restart: unless-stopped
  # ============== DOWNLOADS ==============

  # ============= MONITORING ==============
  scrutiny:
    # Drive health (SMART) dashboard with history and alerts
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO   # read SMART data from SATA drives
      - SYS_ADMIN   # read SMART data from NVMe drives
    devices:
      - ${SCRUTINY_DISK_1}
      - ${SCRUTINY_DISK_2}
      - ${SCRUTINY_DISK_3}
      - ${SCRUTINY_DISK_4}
      - ${SCRUTINY_DISK_5}
    volumes:
      - /run/udev:/run/udev:ro
      - ${APPDATA_LOCATION}/scrutiny/config:/opt/scrutiny/config
      - ${APPDATA_LOCATION}/scrutiny/influxdb:/opt/scrutiny/influxdb
    ports:
      - 8082:8080
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - ${APPDATA_LOCATION}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 3001:3001
    restart: unless-stopped

  beszel:
    # Resource dashboard (CPU, RAM, disks, network, temps, per-container usage)
    image: henrygd/beszel:latest
    container_name: beszel
    environment:
      - APP_URL=http://resources.${LAN_DOMAIN}
    volumes:
      - ${APPDATA_LOCATION}/beszel/data:/beszel_data
      - ${APPDATA_LOCATION}/beszel/socket:/beszel_socket
    ports:
      - 8090:8090
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://localhost:8090
      - TOKEN=${BESZEL_TOKEN}
      - KEY=${BESZEL_KEY}
    volumes:
      - ${APPDATA_LOCATION}/beszel/agent:/var/lib/beszel-agent
      - ${APPDATA_LOCATION}/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STORAGE_LOCATION}:/extra-filesystems/storage:ro
      - ${MEDIA_LOCATION}:/extra-filesystems/media:ro
    restart: unless-stopped
  # ============= MONITORING ==============

  # ============== DASHBOARD ==============
  homepage:
    # One start page with live widgets for every service
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.${LAN_DOMAIN},${SERVER_IP}:3000
      - LOG_TARGETS=stdout
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPDATA_LOCATION}/homepage/images:/app/public/images:ro
    configs:
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml
      - source: homepage_docker
        target: /app/config/docker.yaml
      - source: homepage_bookmarks
        target: /app/config/bookmarks.yaml
      - source: homepage_css
        target: /app/config/custom.css
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 3000:3000
    restart: unless-stopped
  # ============== DASHBOARD ==============

  # =============== CADDY ===============
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
    extra_hosts:
      # Lets Caddy reach Jellyfin, which runs on the host network
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APPDATA_LOCATION}/caddy/data:/data
      - ${APPDATA_LOCATION}/caddy/config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - pihole
      - immich-server
    restart: unless-stopped
  # =============== CADDY ===============

volumes:
  model-cache:

configs:
  homepage_settings:
    content: |
      title: Home server
      theme: dark
      color: slate
      headerStyle: clean
      cardBlur: sm
      background:
        image: /images/background.jpg
        blur: md
        saturate: 75
        brightness: 50
        opacity: 100
      layout:
        Monitoring:
          style: row
          columns: 3
        Media:
          style: row
          columns: 3
        Downloads:
          style: row
          columns: 4
        Network & tools:
          style: row
          columns: 3

  homepage_css:
    content: |
      .rounded-md, .rounded {
          border-radius: 15px !important;
      }

      /* Service items subtle drop shadow */
      .service > div {
          box-shadow: 0 0px 6px -1px var(--tw-shadow-color, #0000001a),
                      0 0px 4px 0px var(--tw-shadow-color, #0000001a);
      }

  homepage_bookmarks:
    content: |
      []

  homepage_docker:
    content: |
      ${HOMEPAGE_DOCKER_SERVER}:
        socket: /var/run/docker.sock

  homepage_widgets:
    content: |
      - resources:
          label: Server
          cpu: true
          memory: true
          uptime: true
      - datetime:
          text_size: md
          format:
            dateStyle: long
            timeStyle: short
            hour12: false

  homepage_services:
    content: |
      - Monitoring:
          - Uptime Kuma:
              icon: uptime-kuma.png
              href: http://status.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: uptime-kuma
              widget:
                type: uptimekuma
                url: http://uptime-kuma:3001
                slug: "${HOMEPAGE_KUMA_SLUG}"
          - Beszel:
              icon: beszel.png
              href: http://resources.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: beszel
              widget:
                type: beszel
                url: http://beszel:8090
                username: "${HOMEPAGE_BESZEL_USER}"
                password: "${HOMEPAGE_BESZEL_PASS}"
                version: 2
          - Scrutiny:
              icon: scrutiny.png
              href: http://scrutiny.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: scrutiny
              widget:
                type: scrutiny
                url: http://scrutiny:8080

      - Media:
          - Jellyfin:
              icon: jellyfin.png
              href: http://jellyfin.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: jellyfin
              widget:
                type: jellyfin
                url: http://host.docker.internal:8096
                key: "${HOMEPAGE_JELLYFIN_KEY}"
                version: 2   # Jellyfin 10.12+
                enableBlocks: true
          - Immich:
              icon: immich.png
              href: http://immich.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: immich_server
              widget:
                type: immich
                url: http://immich-server:2283
                key: "${HOMEPAGE_IMMICH_KEY}"
                version: 2
          - Seerr:
              icon: jellyseerr.png
              href: http://requests.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: seerr
              widget:
                type: seerr
                url: http://seerr:5055
                key: "${HOMEPAGE_SEERR_KEY}"

      - Downloads:
          - Radarr:
              icon: radarr.png
              href: http://radarr.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: radarr
              widget:
                type: radarr
                url: http://radarr:7878
                key: "${HOMEPAGE_RADARR_KEY}"
          - Sonarr:
              icon: sonarr.png
              href: http://sonarr.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: sonarr
              widget:
                type: sonarr
                url: http://sonarr:8989
                key: "${HOMEPAGE_SONARR_KEY}"
          - Prowlarr:
              icon: prowlarr.png
              href: http://prowlarr.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: prowlarr
              widget:
                type: prowlarr
                url: http://prowlarr:9696
                key: "${HOMEPAGE_PROWLARR_KEY}"
          - qBittorrent:
              icon: qbittorrent.png
              href: http://qbittorrent.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: qbittorrent
              widget:
                type: qbittorrent
                url: http://qbittorrent:8085
                username: "${HOMEPAGE_QBIT_USER}"
                password: "${HOMEPAGE_QBIT_PASS}"

      - Network & tools:
          - Pi-hole:
              icon: pi-hole.png
              href: http://pihole.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: pihole
              widget:
                type: pihole
                url: http://pihole:80
                version: 6
                key: "${HOMEPAGE_PIHOLE_KEY}"
          - PufferPanel:
              icon: pufferpanel.png
              href: http://games.${LAN_DOMAIN}
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: pufferpanel
          - Caddy:
              icon: caddy.png
              server: ${HOMEPAGE_DOCKER_SERVER}
              container: caddy

  caddyfile:
    content: |
      {
          # Local-only names: plain HTTP, no certificates
          auto_https off
      }

      http://pihole.${LAN_DOMAIN} {
          redir / /admin/ 302
          reverse_proxy pihole:80
      }

      http://jellyfin.${LAN_DOMAIN} {
          reverse_proxy host.docker.internal:8096
      }

      http://immich.${LAN_DOMAIN} {
          reverse_proxy immich-server:2283
      }

      http://games.${LAN_DOMAIN} {
          reverse_proxy host.docker.internal:8080
      }

      http://qbittorrent.${LAN_DOMAIN} {
          reverse_proxy qbittorrent:8085 {
              header_up Host {upstream_hostport}
              header_up X-Forwarded-Host {host}
          }
      }

      http://prowlarr.${LAN_DOMAIN} {
          reverse_proxy prowlarr:9696
      }

      http://radarr.${LAN_DOMAIN} {
          reverse_proxy radarr:7878
      }

      http://sonarr.${LAN_DOMAIN} {
          reverse_proxy sonarr:8989
      }

      http://requests.${LAN_DOMAIN} {
          reverse_proxy seerr:5055
      }

      http://scrutiny.${LAN_DOMAIN} {
          reverse_proxy scrutiny:8080
      }

      http://status.${LAN_DOMAIN} {
          reverse_proxy uptime-kuma:3001
      }

      http://resources.${LAN_DOMAIN} {
          reverse_proxy beszel:8090
      }

      http://home.${LAN_DOMAIN} {
          reverse_proxy homepage:3000
      }

  smb_conf:
    content: |
      [global]
         # --- Hardening ---
         server role = standalone server
         security = user
         # Only these networks may connect (LAN + Tailscale by default)
         hosts allow = ${SAMBA_HOSTS_ALLOW}
         hosts deny = 0.0.0.0/0
         # Modern SMB only, with all traffic encrypted
         server min protocol = SMB3
         server smb encrypt = required
         # No guest or anonymous access
         map to guest = never
         restrict anonymous = 2
         # Turn off legacy NetBIOS and printing
         disable netbios = yes
         smb ports = 445
         load printers = no
         printing = bsd
         printcap name = /dev/null
         disable spoolss = yes

      [${SAMBA_MEDIA_NAME}]
         path = /${SAMBA_MEDIA_NAME}
         browseable = yes
         read only = no
         guest ok = no
         valid users = ${SAMBA_USER}
         force user = ${SAMBA_USER}
         create mask = 0664
         directory mask = 0775

      [${SAMBA_STORAGE_NAME}]
         path = /${SAMBA_STORAGE_NAME}
         browseable = yes
         read only = yes
         guest ok = no
         valid users = ${SAMBA_USER}
